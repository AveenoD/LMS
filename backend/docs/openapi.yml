        - BearerAuth: []
      responses:
        '200':
          description: All pricing plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanItem' }
    post:
      tags: [Super Admin — Plans]
      summary: Create a new pricing plan
      operationId: createPlan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanRequest' }
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanItem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /superadmin/plans/{id}:
    get:
      tags: [Super Admin — Plans]
      summary: Get plan by ID
      operationId: getPlan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 2 }
      responses:
        '200':
          description: Plan detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Super Admin — Plans]
      summary: Update a plan's prices or features
      operationId: updatePlan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlanRequest' }
            example:
              priceMonthly: 35
              priceYearly: 25
