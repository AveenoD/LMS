openapi: 3.1.0

info:
  title: EdTech OS — Multi-Tenant Coaching API
  version: 1.0.0
  description: |
    **Multi-Tenant EdTech OS** — complete REST API for coaching institute management.

    ### Authentication
    All protected routes require a JWT Bearer token obtained from `POST /auth/login`.
    Include it as: `Authorization: Bearer <accessToken>`

    ### Roles
    | Role | Description |
    |------|-------------|
    | `super_admin` | Platform owner — manages all institutes |
    | `coaching_admin` | Institute owner — manages students, teachers, fees |
    | `teacher` | Takes attendance, uploads content, creates live classes |
    | `student` | Views content, fees, live classes |

    ### Tenant Isolation
    Every request is scoped to the authenticated user's `tenantId` from their JWT.
    Never pass `tenantId` in the body — it is always read from the token.

  contact:
    name: EdTech OS Support
    email: support@edtechos.com
  license:
    name: MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://api.edtechos.com/api/v1
    description: Production server

tags:
  - name: Auth
    description: Login, logout, token refresh
  - name: Public
    description: Unauthenticated endpoints (pricing page, demo bookings)
  - name: Super Admin — Tenants
    description: Manage institutes (Super Admin only)
  - name: Super Admin — Plans
    description: Manage pricing plan catalog (Super Admin only)
  - name: Super Admin — Subscriptions
    description: View and manage subscription billing (Super Admin only)
  - name: Super Admin — Leads
    description: Demo booking inbox (Super Admin only)
  - name: Super Admin — Analytics
    description: Platform-wide KPIs (Super Admin only)
  - name: Super Admin — Notifications
    description: Broadcast in-app notifications to coaching_admins (Super Admin only)
  - name: Coaching Admin — Dashboard
    description: Institute overview
  - name: Coaching Admin — Teachers
    description: Manage teacher accounts
  - name: Coaching Admin — Students
    description: Manage student accounts
  - name: Coaching Admin — Batches & Subjects
    description: Manage batches and subjects
  - name: Coaching Admin — Timetable
    description: Assign teachers to batch/subject/time slots
  - name: Coaching Admin — Fees
    description: Fee structures and payment recording
  - name: Coaching Admin — Branding
    description: Customize logo and theme color
  - name: Coaching Admin — Reports
    description: Performance analytics
  - name: Coaching Admin — Notifications
    description: Notification inbox, and broadcast to students (whole institute or one batch)
  - name: Teacher
    description: Schedule, attendance, content, live classes
  - name: Student
    description: Dashboard, videos, live classes, fees, doubts
  - name: Payments
    description: Razorpay subscription payment flow

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY SCHEMES
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login

  # ───────────────────────────────────────────────────────────────────────────
  # REUSABLE SCHEMAS
  # ───────────────────────────────────────────────────────────────────────────
  schemas:

    # ── Common ───────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Phone must be 10-15 digits
        errors:
          type: array
          items:
            type: object

    SuccessBoolean:
      type: object
      properties:
        success:
          type: boolean
          example: true

    # ── Auth ─────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          example: "919000000013"
          description: 10-15 digit phone number (country code + number)
        password:
          type: string
          example: "Coach@123"
          minLength: 6

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:         { type: integer, example: 13 }
            role:       { type: string, example: student }
            tenantId:   { type: integer, example: 1 }
            fullName:   { type: string, example: Aarav Joshi }
        branding:
          type: object
          properties:
            name:         { type: string, example: Apex Academy }
            logoUrl:      { type: string, nullable: true, example: "https://cdn.edtechos.com/apex.png" }
            primaryColor: { type: string, example: "#2563EB" }

    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:       { type: integer, example: 13 }
            role:     { type: string, example: coaching_admin }
            tenantId: { type: integer, nullable: true, example: 1 }
            fullName: { type: string, example: Rajesh Deshmukh }
            phone:    { type: string, example: "919000000011" }
            email:    { type: string, nullable: true, example: rajesh@apexacademy.com }
        branding:
          $ref: '#/components/schemas/LoginResponse/properties/branding'

    # ── Plan Catalog ──────────────────────────────────────────────────────────
    PlanItem:
      type: object
      properties:
        id:             { type: integer, example: 2 }
        name:           { type: string, example: Pro }
        tagline:        { type: string, example: "Smart automation jo aapka time bachaye." }
        priceMonthly:   { type: integer, example: 30 }
        priceQuarterly: { type: integer, example: 25 }
        priceYearly:    { type: integer, example: 22 }
        features:
          type: array
          items: { type: string }
          example: ["digital_attendance", "live_classes", "whatsapp_reminders"]
        isActive:       { type: boolean, example: true }
        displayOrder:   { type: integer, example: 2 }
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }

    CreatePlanRequest:
      type: object
      required: [name, priceMonthly, priceQuarterly, priceYearly, features]
      properties:
        name:           { type: string, example: Pro }
        tagline:        { type: string, example: "Smart automation jo aapka time bachaye." }
        priceMonthly:   { type: integer, example: 30 }
        priceQuarterly: { type: integer, example: 25 }
        priceYearly:    { type: integer, example: 22 }
        features:
          type: array
          items:
            type: string
            enum: [student_management, batch_management, digital_attendance, fee_management,
                   video_library, whatsapp_reminders, live_classes, performance_reports,
                   online_tests, doubt_solving, custom_branding, teacher_accounts]
          example: ["digital_attendance", "live_classes", "whatsapp_reminders"]
        displayOrder: { type: integer, example: 2 }

    UpdatePlanRequest:
      type: object
      properties:
        tagline:        { type: string }
        priceMonthly:   { type: integer }
        priceQuarterly: { type: integer }
        priceYearly:    { type: integer }
        features:
          type: array
          items: { type: string }
        isActive:     { type: boolean }
        displayOrder: { type: integer }

    # ── Tenant ───────────────────────────────────────────────────────────────
    TenantListItem:
      type: object
      properties:
        id:              { type: integer, example: 1 }
        name:            { type: string, example: Apex Academy }
        slug:            { type: string, example: apex }
        city:            { type: string, nullable: true, example: Nashik }
        isActive:        { type: boolean, example: true }
        status:          { type: string, example: trial }
        trialEndsAt:     { type: string, format: date-time, nullable: true }
        nextBillingDate: { type: string, format: date-time, nullable: true }
        studentCount:    { type: integer, example: 48 }

    RegisterTenantRequest:
      type: object
      required: [name, slug, adminName, adminPhone, adminPassword]
      properties:
        name:          { type: string, example: Apex Academy }
        slug:          { type: string, example: apex, description: "Lowercase letters, digits, hyphens only" }
        city:          { type: string, example: Nashik }
        contactPhone:  { type: string, example: "919999900001" }
        primaryColor:  { type: string, example: "#2563EB" }
        adminName:     { type: string, example: Rajesh Deshmukh }
        adminPhone:    { type: string, example: "919000000011" }
        adminPassword: { type: string, example: "Coach@123", minLength: 6 }
        plan:          { type: string, enum: [flat, per_student], example: per_student }
        amount:        { type: integer, example: 2500 }

    TenantSubscriptionDetail:
      type: object
      properties:
        tenantId:              { type: integer, example: 1 }
        tenantName:            { type: string, example: Apex Academy }
        status:                { type: string, example: trial }
        planId:                { type: integer, nullable: true, example: 2 }
        planName:              { type: string, nullable: true, example: Pro }
        billingCycle:          { type: string, example: yearly }
        perStudentRate:        { type: integer, nullable: true, example: 22 }
        studentCountSnapshot:  { type: integer, nullable: true, example: 80 }
        amount:                { type: integer, example: 21120 }
        trialEndsAt:           { type: string, format: date-time, nullable: true }
        nextBillingDate:       { type: string, format: date-time, nullable: true }

    AssignPlanRequest:
      type: object
      required: [planCatalogId, billingCycle]
      properties:
        planCatalogId: { type: integer, example: 2 }
        billingCycle:
          type: string
          enum: [monthly, quarterly, yearly]
          example: yearly

    # ── Subscription ─────────────────────────────────────────────────────────
    SubscriptionListItem:
      type: object
      properties:
        tenantId:        { type: integer, example: 1 }
        name:            { type: string, example: Apex Academy }
        status:          { type: string, example: active }
        plan:            { type: string, example: per_student }
        amount:          { type: integer, example: 21120 }
        trialEndsAt:     { type: string, format: date-time, nullable: true }
        nextBillingDate: { type: string, format: date-time, nullable: true }

    # ── Lead ─────────────────────────────────────────────────────────────────
    CreateLeadRequest:
      type: object
      required: [ownerName, instituteName, phone]
      properties:
        ownerName:     { type: string, example: Suresh Mehta }
        instituteName: { type: string, example: "Mehta Coaching Classes" }
        phone:         { type: string, example: "919876543210" }
        city:          { type: string, example: Nashik }
        studentCount:  { type: integer, example: 120 }
        message:       { type: string, example: "We need live classes and fee management." }

    LeadItem:
      type: object
      properties:
        id:            { type: integer, example: 5 }
        ownerName:     { type: string, example: Suresh Mehta }
        instituteName: { type: string, example: "Mehta Coaching Classes" }
        phone:         { type: string, example: "919876543210" }
        city:          { type: string, example: Nashik }
        studentCount:  { type: integer, nullable: true, example: 120 }
        message:       { type: string, nullable: true }
        status:        { type: string, example: new }
        isRead:        { type: boolean, example: false }
        createdAt:     { type: string, format: date-time }

    # ── Teacher ──────────────────────────────────────────────────────────────
    CreateTeacherRequest:
      type: object
      required: [fullName, phone, password]
      properties:
        fullName: { type: string, example: "Sunita Patil" }
        phone:    { type: string, example: "919000000012" }
        password: { type: string, example: "Teacher@123", minLength: 6 }
        email:    { type: string, format: email, example: "sunita@apexacademy.com" }

    TeacherItem:
      type: object
      properties:
        id:       { type: integer, example: 4 }
        fullName: { type: string, example: "Sunita Patil" }
        phone:    { type: string, example: "919000000012" }
        email:    { type: string, nullable: true }

    # ── Student ──────────────────────────────────────────────────────────────
    CreateStudentRequest:
      type: object
      required: [fullName, phone, password, parentPhone, batchId]
      properties:
        fullName:    { type: string, example: "Aarav Joshi" }
        phone:       { type: string, example: "919000000013" }
        password:    { type: string, example: "Student@123", minLength: 6 }
        parentName:  { type: string, example: "Ramesh Joshi" }
        parentPhone: { type: string, example: "919000000099" }
        grade:       { type: string, example: "Class 11" }
        rollNo:      { type: string, example: "APX-001" }
        batchId:     { type: integer, example: 3 }

    StudentListItem:
      type: object
      properties:
        id:          { type: integer, example: 7 }
        fullName:    { type: string, example: "Aarav Joshi" }
        rollNo:      { type: string, nullable: true, example: "APX-001" }
        grade:       { type: string, nullable: true, example: "Class 11" }
        parentPhone: { type: string, example: "919000000099" }

    # ── Batch & Subject ───────────────────────────────────────────────────────
    CreateBatchRequest:
      type: object
      required: [name]
      properties:
        name:  { type: string, example: "JEE 2026 Morning" }
        grade: { type: string, example: "Class 11" }

    BatchItem:
      type: object
      properties:
        id:           { type: integer, example: 3 }
        name:         { type: string, example: "JEE 2026 Morning" }
        grade:        { type: string, nullable: true, example: "Class 11" }
        studentCount: { type: integer, example: 48 }

    CreateSubjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Physics }

    SubjectItem:
      type: object
      properties:
        id:   { type: integer, example: 1 }
        name: { type: string, example: Physics }

    # ── Timetable ────────────────────────────────────────────────────────────
    CreateTimetableRequest:
      type: object
      required: [batchId, teacherId, dayOfWeek, startTime, endTime]
      properties:
        batchId:    { type: integer, example: 3 }
        subjectId:  { type: integer, example: 1 }
        teacherId:  { type: integer, example: 4 }
        dayOfWeek:  { type: integer, minimum: 0, maximum: 6, example: 1, description: "0=Sun, 1=Mon … 6=Sat" }
        startTime:  { type: string, example: "09:00" }
        endTime:    { type: string, example: "10:30" }

    TimetableItem:
      type: object
      properties:
        id:        { type: integer, example: 12 }
        batch:     { type: string, example: "JEE 2026 Morning" }
        subject:   { type: string, nullable: true, example: Physics }
        teacher:   { type: string, example: "Sunita Patil" }
        startTime: { type: string, example: "09:00:00" }
        endTime:   { type: string, example: "10:30:00" }

    # ── Fees ─────────────────────────────────────────────────────────────────
    CreateFeeStructureRequest:
      type: object
      required: [title, amount]
      properties:
        batchId: { type: integer, example: 3 }
        title:   { type: string, example: "Term 1 Fee" }
        amount:  { type: integer, example: 15000 }
        dueDate: { type: string, format: date, example: "2026-08-15" }

    RecordPaymentRequest:
      type: object
      required: [studentId, amountPaid]
      properties:
        studentId:       { type: integer, example: 7 }
        feeStructureId:  { type: integer, example: 2 }
        amountPaid:      { type: integer, example: 15000 }
        method:          { type: string, enum: [cash, upi, card], example: upi }

    FeeListItem:
      type: object
      properties:
        studentId: { type: integer, example: 7 }
        name:      { type: string, example: "Aarav Joshi" }
        total:     { type: integer, example: 15000 }
        paid:      { type: integer, example: 10000 }
        pending:   { type: integer, example: 5000 }

    # ── Attendance ───────────────────────────────────────────────────────────
    AttendanceRecord:
      type: object
      required: [studentId, status]
      properties:
        studentId: { type: integer, example: 7 }
        status:    { type: string, enum: [present, absent, late], example: present }

    MarkAttendanceRequest:
      type: object
      required: [batchId, date, records]
      properties:
        batchId:     { type: integer, example: 3 }
        timetableId: { type: integer, example: 12 }
        date:        { type: string, format: date, example: "2026-07-09" }
        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AttendanceRecord'

    # ── Content ──────────────────────────────────────────────────────────────
    CreateContentRequest:
      type: object
      required: [title, youtubeUrl]
      properties:
        title:      { type: string, example: "Kinematics — Part 1" }
        youtubeUrl: { type: string, format: uri, example: "https://youtu.be/abc123" }
        batchId:    { type: integer, example: 3 }
        subjectId:  { type: integer, example: 1 }

    ContentItem:
      type: object
      properties:
        id:         { type: integer, example: 9 }
        title:      { type: string, example: "Kinematics — Part 1" }
        youtubeUrl: { type: string, example: "https://youtu.be/abc123" }
        batch:      { type: string, nullable: true, example: "JEE 2026 Morning" }
        subject:    { type: string, nullable: true, example: Physics }

    # ── Live Classes ─────────────────────────────────────────────────────────
    CreateLiveClassRequest:
      type: object
      required: [title, meetUrl, batchId, scheduledAt]
      properties:
        title:       { type: string, example: "Thermodynamics Revision" }
        meetUrl:     { type: string, format: uri, example: "https://meet.google.com/xyz-abc-def" }
        batchId:     { type: integer, example: 3 }
        scheduledAt: { type: string, format: date-time, example: "2026-07-10T09:00:00+05:30" }

    LiveClassItem:
      type: object
      properties:
        id:          { type: integer, example: 5 }
        title:       { type: string, example: "Thermodynamics Revision" }
        meetUrl:     { type: string, example: "https://meet.google.com/xyz-abc-def" }
        scheduledAt: { type: string, format: date-time }
        joinable:    { type: boolean, example: true, description: "True if class is within join window" }

    # ── Payment ──────────────────────────────────────────────────────────────
    CreateOrderResponse:
      type: object
      properties:
        orderId:        { type: string, example: "order_OESzy9YZbLBrze" }
        amount:         { type: integer, example: 2112000, description: "Total amount in paise" }
        amountRupees:   { type: integer, example: 21120, description: "Total amount in ₹" }
        currency:       { type: string, example: INR }
        keyId:          { type: string, example: "rzp_live_XXXXX" }
        studentCount:   { type: integer, example: 80 }
        perStudentRate: { type: integer, example: 22 }
        billingCycle:   { type: string, example: yearly }
        mock:           { type: boolean, example: false }

    VerifyPaymentRequest:
      type: object
      required: [orderId, paymentId]
      properties:
        orderId:   { type: string, example: "order_OESzy9YZbLBrze" }
        paymentId: { type: string, example: "pay_OESzy9YZbLBrze" }
        signature: { type: string, example: "abc123def456...", description: "HMAC-SHA256 signature. Optional for dev mock orders." }

    # ── Analytics ────────────────────────────────────────────────────────────
    PlatformAnalytics:
      type: object
      properties:
        totalTenants:  { type: integer, example: 12 }
        activeTenants: { type: integer, example: 10 }
        totalStudents: { type: integer, example: 1450 }
        mrr:           { type: integer, example: 185000, description: "Monthly recurring revenue in ₹" }
        onTrial:       { type: integer, example: 3 }

    # ── Notifications ────────────────────────────────────────────────────────
    NotificationItem:
      type: object
      properties:
        id:        { type: integer, example: 41 }
        title:     { type: string, example: "Fee due date extended" }
        body:      { type: string, nullable: true, example: "Term 1 fee due date moved to the 20th for all batches." }
        isRead:    { type: boolean, example: false }
        createdAt: { type: string, format: date-time, example: "2026-07-15T09:00:00.000Z" }

    BroadcastResponse:
      type: object
      properties:
        recipientCount:
          type: integer
          example: 12
          description: Number of users a notification row was inserted for.

    BroadcastToAdminsRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, example: "Platform maintenance tonight" }
        body:  { type: string, example: "The app will be briefly unavailable between 1-2 AM IST for scheduled maintenance." }
        city:
          type: string
          example: Nashik
          description: Omit to broadcast to every coaching_admin platform-wide; set to target only institutes in one city.

    BroadcastToStudentsRequest:
      type: object
      required: [title]
      properties:
        title:   { type: string, example: "Holiday tomorrow" }
        body:    { type: string, example: "Institute will remain closed tomorrow for a public holiday." }
        batchId:
          type: integer
          example: 4
          description: Omit to broadcast to every student in the institute; set to target only one batch.

  # ── Common Responses ───────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INVALID_TOKEN, message: "Token is invalid or expired" }

    Forbidden:
      description: Insufficient role or plan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            role_forbidden:
              value: { code: FORBIDDEN, message: "Access denied for your role" }
            trial_expired:
              value: { code: TRIAL_EXPIRED, message: "Your free trial has ended. Please subscribe." }
            plan_upgrade:
              value: { code: PLAN_UPGRADE_REQUIRED, message: "This feature requires the Pro plan or higher." }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: "Resource not found" }

    ValidationError:
      description: Request body / params failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: VALIDATION_ERROR, message: "phone: Phone must be 10-15 digits" }

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════════════════════════════════
  # HEALTH
  # ══════════════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Public]
      summary: Health check
      description: Returns server and database status. No auth required.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              example:
                status: ok
                db: true
                ts: "2026-07-09T16:00:00.000Z"
        '503':
          description: Database unreachable

  # ══════════════════════════════════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticates a user and returns JWT access + refresh tokens along with branding info.
        One login form for every role — phone + password only. Phone is globally
        unique across all institutes, so the backend resolves the user (and, for
        non-super-admin roles, the institute/branding) from the phone number alone.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              student_login:
                summary: Student login
                value: { phone: "919000000013", password: "Student@123" }
              admin_login:
                summary: Coaching Admin login
                value: { phone: "919000000011", password: "Coach@123" }
              superadmin_login:
                summary: Super Admin login
                value: { phone: "918888800000", password: "Admin@123" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              example: { code: INVALID_CREDENTIALS, message: "Phone or password is incorrect" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              example: { accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns the authenticated user's profile and institute branding.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Signals logout. Client should discard stored tokens.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example: { success: true }

  # ══════════════════════════════════════════════════════════════════════════
  # PUBLIC
  # ══════════════════════════════════════════════════════════════════════════
  /public/plans:
    get:
      tags: [Public]
      summary: List active pricing plans
      description: Returns all active plans from the catalog. Used by the marketing/pricing page. No auth required.
      operationId: listPublicPlans
      responses:
        '200':
          description: Active pricing plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanItem' }
              example:
                - id: 1
                  name: Basic
                  tagline: "Apni coaching ko digital banayein."
                  priceMonthly: 20
                  priceQuarterly: 15
                  priceYearly: 12
                  features: [student_management, digital_attendance, fee_management, video_library]
                  isActive: true
                  displayOrder: 1

  /leads:
    post:
      tags: [Public]
      summary: Book a demo (lead submission)
      description: |
        Public endpoint for the marketing site's "Book a Demo" form.
        Saves the lead and fires notifications (email + Telegram) to the platform owner.
        Rate-limited to prevent spam.
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadRequest' }
      responses:
        '201':
          description: Lead submitted successfully
          content:
            application/json:
              example: { success: true, message: "Demo request received. We'll contact you soon!" }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              example: { code: RATE_LIMIT, message: "Too many requests. Try again later." }

  # ══════════════════════════════════════════════════════════════════════════
  # SUPER ADMIN — TENANTS
  # ══════════════════════════════════════════════════════════════════════════
  /superadmin/tenants:
    get:
      tags: [Super Admin — Tenants]
      summary: List all institutes
      operationId: listTenants
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of all institutes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Super Admin — Tenants]
      summary: Register a new institute
      description: Creates a new tenant with a trial subscription and coaching_admin account in one transaction.
      operationId: registerTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTenantRequest' }
      responses:
        '201':
          description: Institute registered
          content:
            application/json:
              example:
                tenant: { id: 3, name: "Mehta Classes", slug: "mehta", city: "Nashik" }
                adminUser: { id: 15, fullName: "Suresh Mehta", phone: "919876543210", role: coaching_admin }
        '409':
          description: Slug already taken
          content:
            application/json:
              example: { code: SLUG_TAKEN, message: "This slug is already in use" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /superadmin/tenants/{id}/suspend:
    patch:
      tags: [Super Admin — Tenants]
      summary: Activate / Suspend an institute
      operationId: suspendTenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean, example: false }
      responses:
        '200':
          description: Tenant activation state updated
          content:
            application/json:
              example: { id: 1, name: "Apex Academy", isActive: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /superadmin/tenants/{id}/subscription:
    get:
      tags: [Super Admin — Subscriptions]
      summary: Get tenant subscription detail
      operationId: getTenantSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Tenant subscription detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSubscriptionDetail' }
    put:
      tags: [Super Admin — Subscriptions]
      summary: Assign / change plan and billing cycle for a tenant
      operationId: assignPlan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignPlanRequest' }
      responses:
        '200':
          description: Plan assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSubscriptionDetail' }

