  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENTS (Razorpay)
  # ══════════════════════════════════════════════════════════════════════════
  /payments/create-order:
    post:
      tags: [Payments]
      summary: Create Razorpay subscription order
      description: |
        Calculates the billing amount server-side:
        `per_student_rate × student_count × billing_cycle_months`
        Returns a Razorpay `order_id` to pass to the Flutter Razorpay checkout.
      operationId: createOrder
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Razorpay order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400':
          description: No students enrolled yet
          content:
            application/json:
              example: { code: NO_STUDENTS, message: "Cannot create subscription order: no students enrolled yet." }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify payment and activate subscription
      description: |
        Verifies the Razorpay HMAC-SHA256 signature server-side.
        On success: sets `subscription.status = 'active'`, snapshots student count,
        and sets `next_billing_date` based on billing cycle.
      operationId: verifyPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyPaymentRequest' }
      responses:
        '200':
          description: Payment verified, subscription activated
          content:
            application/json:
              example:
                status: active
                nextBillingDate: "2027-07-09T11:05:00.000Z"
        '400':
          description: Invalid payment signature
          content:
            application/json:
              example: { code: INVALID_SIGNATURE, message: "Payment signature verification failed" }

  /payments/subscription:
    get:
      tags: [Payments]
      summary: Get current subscription status
      description: Returns billing info for the coaching admin's institute.
      operationId: subscriptionStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              example:
                id: 1
                plan: per_student
                amount: 21120
                status: active
                billingCycle: yearly
                perStudentRate: 22
                trialEndsAt: null
                nextBillingDate: "2027-07-09T11:05:00.000Z"
