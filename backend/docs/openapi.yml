      operationId: updateBranding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logoUrl:      { type: string, format: uri, example: "https://cdn.edtechos.com/apex-new.png" }
