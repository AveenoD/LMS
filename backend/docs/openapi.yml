              schema: { $ref: '#/components/schemas/PlatformAnalytics' }

  # ══════════════════════════════════════════════════════════════════════════
  # SUPER ADMIN — NOTIFICATIONS
  # ══════════════════════════════════════════════════════════════════════════
  /superadmin/notifications/broadcast:
    post:
      tags: [Super Admin — Notifications]
      summary: Broadcast a notification to coaching_admins
      description: |
        Inserts one notification row per matching coaching_admin, in a single
        query. Omit `city` to reach every institute platform-wide, or set it
        to target only institutes in one city/area.
      operationId: broadcastToAdmins
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastToAdminsRequest' }
            examples:
              all_admins:
                summary: Broadcast to every institute
                value: { title: "Platform maintenance tonight", body: "Brief downtime 1-2 AM IST." }
              by_city:
                summary: Broadcast filtered by city
                value: { title: "Nashik office closed Monday", city: Nashik }
      responses:
        '201':
          description: Broadcast sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

