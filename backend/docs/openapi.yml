  # ══════════════════════════════════════════════════════════════════════════
  # COACHING ADMIN — REPORTS
  # ══════════════════════════════════════════════════════════════════════════
  /admin/reports/performance:
    get:
      tags: [Coaching Admin — Reports]
      summary: Institute performance report
      description: |
        **Requires Pro or Elite plan** (`performance_reports` feature).
        Returns average attendance, average marks, and top students.
      operationId: performanceReport
      security:
        - BearerAuth: []
      parameters:
        - name: batchId
          in: query
          schema: { type: integer, example: 3 }
          description: Filter by batch (optional)
      responses:
        '200':
          description: Performance report
          content:
            application/json:
              example:
                avgAttendance: 87.4
                avgMarks: 72.1
                topStudents:
                  - studentId: 7
                    name: "Aarav Joshi"
                    avgMarks: 91.5
                    attendancePct: 96.0
        '403': { $ref: '#/components/responses/Forbidden' }

  # ══════════════════════════════════════════════════════════════════════════
  # COACHING ADMIN — NOTIFICATIONS
  # ══════════════════════════════════════════════════════════════════════════
  /admin/notifications:
    get:
      tags: [Coaching Admin — Notifications]
      summary: My notification inbox
      description: Most recent 50 notifications for the logged-in coaching_admin.
      operationId: adminListNotifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationItem' }

  /admin/notifications/unread-count:
    get:
      tags: [Coaching Admin — Notifications]
      summary: Unread notification count (for badge)
      operationId: adminUnreadNotificationCount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              example: { count: 2 }

  /admin/notifications/{id}/read:
    patch:
      tags: [Coaching Admin — Notifications]
      summary: Mark a notification as read
      operationId: adminMarkNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 41 }
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              example: { success: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/notifications/broadcast:
    post:
      tags: [Coaching Admin — Notifications]
      summary: Broadcast a notification to students
      description: |
        Inserts one notification row per matching student in the caller's own
        institute (tenant is always taken from the JWT, never the request
        body). Omit `batchId` to reach every student, or set it to target
        only one batch. Blocked when subscription is expired/past_due.
      operationId: broadcastToStudents
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastToStudentsRequest' }
            examples:
              all_students:
                summary: Broadcast to the whole institute
                value: { title: "Holiday tomorrow", body: "Institute closed for a public holiday." }
              by_batch:
                summary: Broadcast filtered by batch
                value: { title: "Test postponed", batchId: 4 }
      responses:
        '201':
          description: Broadcast sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ══════════════════════════════════════════════════════════════════════════
  # TEACHER
  # ══════════════════════════════════════════════════════════════════════════
  /teacher/schedule/today:
    get:
      tags: [Teacher]
      summary: Today's class schedule
      operationId: todaySchedule
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Today's timetable entries
          content:
            application/json:
              example:
                - timetableId: 12
                  batch: "JEE 2026 Morning"
                  subject: Physics
                  startTime: "09:00:00"
                  endTime: "10:30:00"

  /teacher/batches/{batchId}/students:
    get:
      tags: [Teacher]
      summary: Get students in a batch (for attendance)
      operationId: batchStudents
      security:
        - BearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: integer, example: 3 }
      responses:
        '200':
          description: Students in batch
          content:
            application/json:
              example:
                - studentId: 7
                  name: "Aarav Joshi"
                  rollNo: "APX-001"

  /teacher/attendance:
    post:
      tags: [Teacher]
      summary: Mark attendance (bulk)
      description: |
        Saves attendance for all students in a batch for the given date.
        Returns `absentReminders` — pre-built `wa.me` links for absent students'
        parents (only returned if the institute has the `whatsapp_reminders` feature).
      operationId: markAttendance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkAttendanceRequest' }
            example:
              batchId: 3
              timetableId: 12
              date: "2026-07-09"
              records:
                - { studentId: 7, status: present }
                - { studentId: 8, status: absent }
                - { studentId: 9, status: late }
      responses:
        '200':
          description: Attendance saved
          content:
            application/json:
              example:
                saved: true
                absentReminders:
                  - "https://wa.me/919000000099?text=Aarav%20Joshi%20aaj%20absent%20hai."

  /teacher/content:
    get:
      tags: [Teacher]
      summary: List uploaded video content
      operationId: listContent
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Content list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentItem' }
    post:
      tags: [Teacher]
      summary: Upload a video lecture link
      operationId: createContent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContentRequest' }
      responses:
        '201':
          description: Content added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }

  /teacher/live-classes:
    post:
      tags: [Teacher]
      summary: Schedule a live class
      description: |
        **Requires Pro or Elite plan** (`live_classes` feature).
      operationId: createLiveClass
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveClassRequest' }
      responses:
        '201':
          description: Live class scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveClassItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teacher/doubt-link/{studentId}:
    get:
      tags: [Teacher]
      summary: Get WhatsApp doubt-answer link
      description: |
        **Requires Pro or Elite plan** (`doubt_solving` feature).
        Returns a pre-filled `wa.me` URL from teacher to the student.
      operationId: doubtLink
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer, example: 7 }
        - name: text
          in: query
          schema: { type: string, example: "Your doubt about Newton's 3rd law has been answered." }
      responses:
        '200':
          description: WhatsApp link
          content:
            application/json:
              example:
                waUrl: "https://wa.me/919000000013?text=Your%20doubt%20about%20Newton%27s%203rd%20law..."
        '403': { $ref: '#/components/responses/Forbidden' }

