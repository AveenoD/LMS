      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanItem' }
    delete:
      tags: [Super Admin — Plans]
      summary: Deactivate a plan (soft delete)
      description: Sets `isActive = false`. Existing subscribers keep their plan.
      operationId: deactivatePlan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 2 }
      responses:
        '200':
          description: Plan deactivated
          content:
            application/json:
              example: { id: 2, name: Pro, isActive: false }

